name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Clean Gradle Cache
      run: |
        rm -rf ~/.gradle/caches
        rm -rf ~/.gradle/wrapper/dists
        echo "Gradle cache cleared."

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7
        cache-disabled: false
        cache-overwrite-existing: true

    - name: Generate Gradle Wrapper if Missing
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper --gradle-version 8.7
        fi
        chmod +x gradlew

    - name: Decode Keystore
      run: |
        base64 -d release-keystore.base64 > my-upload-key.p12
        echo "Keystore decoded."

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-configuration-cache --stacktrace --refresh-dependencies
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
        STORE_PASSWORD: "AsyriaV5@2026"
        KEY_PASSWORD: "AsyriaV5@2026"
        KEYSTORE_PATH: "${{ github.workspace }}/my-upload-key.p12"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: A_SYRIA_V5_RELEASE
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30
